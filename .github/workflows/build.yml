name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - run: GOOS=android GOARCH=arm64 go vet ./mobile/ ./core/...
      - run: GOOS=windows go vet ./...

  windows:
    runs-on: ubuntu-latest
    needs: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build the app (window, VPN) and the console client
        run: |
          set -e
          # One version for all platforms: the Android app's versionName.
          v=$(grep -o 'versionName = "[^"]*"' android/app/build.gradle.kts | cut -d'"' -f2)
          case "$GITHUB_REF" in refs/tags/v*) ;; *) v="$v-${GITHUB_SHA::7}" ;; esac
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w -H windowsgui -X main.version=$v" -o dist/TurnVK.exe ./cmd/turnvkw
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w -X main.version=$v" -o dist/turnvk.exe ./cmd/turnvk
      - uses: actions/upload-artifact@v4
        with:
          name: turnvk-windows-amd64
          path: |
            dist/TurnVK.exe
            dist/turnvk.exe

  android:
    runs-on: ubuntu-latest
    needs: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build the Go engine (gomobile)
        run: |
          set -e
          go env -w GOPROXY="https://proxy.golang.org,direct"
          # The module proxy occasionally resets the connection mid-download
          # (stream error INTERNAL_ERROR). gomobile bind is the only step that
          # needs the network, so retry the whole thing rather than failing the
          # build on a transient TCP reset.
          for attempt in 1 2 3 4 5; do
            if [ "$attempt" -gt 1 ]; then
              echo "gomobile attempt $attempt/5 (retrying after network error)"
              sleep 15
            fi
            if go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20261011034528-197770444867 && \
               go install golang.org/x/mobile/cmd/gobind@v0.0.0-20261011034528-197770444867 && \
               export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}" && \
               gomobile init && \
               mkdir -p android/app/libs && \
               gomobile bind -v -target=android/arm64,android/arm,android/amd64 -androidapi 24 \
                 -trimpath -ldflags="-s -w -checklinkname=0" -o android/app/libs/turnvk.aar ./mobile; then
              echo "gomobile build succeeded on attempt $attempt"
              break
            fi
          done
          # -checklinkname=0: github.com/wlynxg/anet (used by pion on Android)
          # links to net internals, which newer Go refuses by default.
      - name: Build the app
        env:
          KEYSTORE_B64: ${{ secrets.TURNVK_KEYSTORE_B64 }}
          TURNVK_KEYSTORE_PASSWORD: ${{ secrets.TURNVK_KEYSTORE_PASSWORD }}
        run: |
          set -e
          # The release key (repository secrets): every release is signed
          # with it, so a new APK installs over the previous one. A tag
          # without the key fails rather than publish an APK that cannot
          # update the installed app.
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/turnvk.jks"
            export TURNVK_KEYSTORE="$RUNNER_TEMP/turnvk.jks"
          elif [ "${GITHUB_REF#refs/tags/v}" != "$GITHUB_REF" ]; then
            echo "::error::TURNVK_KEYSTORE_B64 secret is not set"; exit 1
          fi
          gradle -p android assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: turnvk-android
          path: android/app/build/outputs/apk/release/*.apk

  # A tag v* publishes a GitHub release with the Windows app, the console
  # client and the APK.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [windows, android]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          tag="${GITHUB_REF_NAME}"
          mkdir -p files
          cp out/turnvk-windows-amd64/TurnVK.exe files/TurnVK-${tag}-windows-amd64.exe
          cp out/turnvk-windows-amd64/turnvk.exe files/turnvk-cli-${tag}-windows-amd64.exe
          cp out/turnvk-android/*.apk files/TurnVK-${tag}.apk
          (cd files && sha256sum * > SHA256SUMS.txt)
          gh release create "$tag" files/* --repo "$GITHUB_REPOSITORY" --title "TurnVK ${tag#v}" --notes-file - <<'NOTES'
          TurnVK для Windows и Android.

          - TurnVK-…-windows-amd64.exe — приложение для Windows: окно и VPN для всего компьютера. При запуске просит права администратора (нужны для сетевого адаптера).
          - TurnVK-….apk — приложение для Android.
          - turnvk-cli-…-windows-amd64.exe — консольный клиент (SOCKS5-прокси, проверки).

          Начиная с 0.4.0 APK подписан постоянным ключом: следующие версии ставятся поверх и обновляются из приложения. Чтобы перейти на 0.4.0 с более ранней версии, удалите старую один раз.
          Если на компьютере работает другой VPN (например, v2RayTun), выключите его: два VPN вместе не работают.
          NOTES
