name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - run: GOOS=android GOARCH=arm64 go vet ./mobile/ ./core/...
      - run: GOOS=windows go vet ./...

  windows:
    runs-on: ubuntu-latest
    needs: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/turnvk.exe ./cmd/turnvk
      - uses: actions/upload-artifact@v4
        with:
          name: turnvk-windows-amd64
          path: dist/turnvk.exe

  android:
    runs-on: ubuntu-latest
    needs: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build the Go engine (gomobile)
        run: |
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20261011034528-197770444867
          go install golang.org/x/mobile/cmd/gobind@v0.0.0-20261011034528-197770444867
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          gomobile init
          mkdir -p android/app/libs
          gomobile bind -target=android/arm64,android/arm,android/amd64 -androidapi 24 \
            -trimpath -ldflags="-s -w" -o android/app/libs/turnvk.aar ./mobile
      - name: Build the app
        run: gradle -p android assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: turnvk-android
          path: android/app/build/outputs/apk/release/*.apk
